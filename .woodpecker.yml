# .woodpecker.yml - Woodpecker CI pipeline (local backend: steps run in the agent)
when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: deploy
    image: alpine   # required by Woodpecker's schema; IGNORED by the local backend (no pull)
    commands:
      - echo "deploying $CI_REPO"
      - ./deploy.sh
